[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "crispdm-studio"
version = "1.0.0"
description = "Assignment 1 Part 1: dataset-agnostic CRISP-DM analysis studio"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "streamlit==1.62.0",
  "pandas==3.0.5",
  "numpy==2.3.2",
  "plotly==6.3.0",
  "scikit-learn==1.9.0",
  "scipy==1.16.1",
  "statsmodels==0.14.5",
  "jinja2==3.1.6",
  "weasyprint==66.0",
  "kaleido==1.0.0",
  "charset-normalizer==3.4.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.9",
  "black==25.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
