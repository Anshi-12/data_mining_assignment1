[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-detection-replica"
version = "0.1.0"
description = "Assignment 1 Part 2 - anomaly detection replication and improvements"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "numpy==2.3.2",
  "pandas==2.3.1",
  "scikit-learn==1.7.1",
  "joblib==1.5.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "httpx==0.28.1",
  "ruff==0.12.9",
  "black==25.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
